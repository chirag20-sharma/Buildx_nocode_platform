<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Guitar Store (Updated)</title>
  <meta name="description" content="Vintage and custom guitars" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>


  <main class="bx-flow-wrapper">
    
  <nav class="bx-navbar" style="background-color: #0f172a; color: #f1f5f9;">
    <div class="bx-nav-brand">Gibson &amp; Fender Store</div>
    <div class="bx-nav-links">
      <a href="#guitars" class="bx-nav-link" style="color: #f1f5f9;">Guitars</a>
      <a href="#amps" class="bx-nav-link" style="color: #f1f5f9;">Amps</a>
      <a href="#accessories" class="bx-nav-link" style="color: #f1f5f9;">Accessories</a>
      <a href="#contact" class="bx-nav-link" style="color: #f1f5f9;">Contact</a>
    </div>
  </nav>


  <section class="bx-hero" style="background-color: #0f172a; color: #f1f5f9;">
    <div class="bx-hero-content">
      <h1>Legendary Tone, Handcrafted</h1>
      <p>Discover our rare collection of vintage guitars and boutique amps.</p>
      <button class="bx-button bx-hero-btn" onclick="alert('Action triggered: Shop Guitars')">Shop Guitars</button>
    </div>
  </section>


  <div class="bx-product-card">
    <div class="bx-product-img">
      <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&auto=format&fit=crop&q=60" alt="1959 Custom Sunburst" />
    </div>
    <div class="bx-product-info">
      <span class="bx-product-brand">Gibson</span>
      <h4>1959 Custom Sunburst</h4>
      <div class="bx-product-rating">★ 4.9</div>
      <div class="bx-product-price">$4,299.00</div>
      <button class="bx-button bx-cart-btn" onclick="alert('Added 1959 Custom Sunburst to cart!')">Add to Cart</button>
    </div>
  </div>


  <footer class="bx-footer" style="background-color: #0f172a; color: #94a3b8;">
    <p>© 2026 My Guitar Store. Built with BuildX.</p>
  </footer>

  <span class="bx-badge" style="background-color: #6366f1; color: #ffffff;">Summer Sale 20% OFF</span>
  </main>

  <!-- Floating "Built with BuildX" Badge -->
  <aside class="bx-watermark">
    <a href="http://localhost:5173" target="_blank" rel="noopener noreferrer">
      <span class="bx-watermark-icon">B</span>
      <span>Built with BuildX</span>
    </a>
  </aside>

  <script>
    function switchTab(btn, containerId, targetIndex) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const btns = container.querySelectorAll('.bx-tab-btn');
      const panes = container.querySelectorAll('.bx-tab-pane');
      btns.forEach((b, i) => b.classList.toggle('active', i === targetIndex));
      panes.forEach((p, i) => p.classList.toggle('active', i === targetIndex));
    }
  </script>
</body>
</html>
